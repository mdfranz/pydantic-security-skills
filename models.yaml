default_model: "google:gemini-3-flash-preview"
providers:
  google:
    description: "Google Gemini Models"
    models:
      - id: "google:gemini-3-flash-preview"
        alias: "gemini-3-flash"
        description: "Gemini 3 Flash Preview"

      - id: "google:gemini-3.5-flash"
        alias: "gemini-3.5-flash"
        description: "Gemini 3.5 Flash"

      - id: "google:gemini-3.6-flash"
        alias: "gemini-3.6-flash"
        description: "Gemini 3.6 Flash"

      - id: "google:gemini-3.7-flash"
        alias: "gemini-3.7-flash"
        description: "Gemini 3.7 Flash"

  openai:
    description: "OpenAI Models"
    models:
      - id: "openai:gpt-5-mini"
        alias: "gpt-5-mini"
        description: "GPT-5 Mini"

      - id: "openai:gpt-5.6-sol"
        alias: "gpt-5-sol"
        description: "GPT-5.6 Sol"

  anthropic:
    description: "Anthropic Models"
    models:
      - id: "anthropic:claude-haiku-4-5"
        alias: "claude-haiku"
        description: "Claude Haiku 4.5"

  openrouter:
    description: "OpenRouter Models"
    models:
      - id: "openrouter:deepseek/deepseek-v4-pro"
        alias: "deepseek-v4-pro"
        description: "DeepSeek V4 Pro (Reasoning)"

      - id: "openrouter:deepseek/deepseek-v4-flash"
        alias: "deepseek-v4-flash"
        description: "DeepSeek V4 Flash"

      - id: "openrouter:nvidia/nemotron-3-ultra-550b-a55b"
        alias: "nemotron-3-ultra"
        description: "NVIDIA Nemotron 3 Ultra 550B"

      - id: "openrouter:moonshotai/kimi-k3"
        alias: "kimi-k3"
        description: "Moonshot AI Kimi K3 (Reasoning)"

      - id: "openrouter:z-ai/glm-5"
        alias: "glm-5"
        description: "Z.ai GLM-5"

      - id: "openrouter:z-ai/glm-5.2"
        alias: "glm-5.2"
        description: "Z.ai GLM-5.2 (Reasoning)"

      - id: "openrouter:minimax/minimax-m3"
        alias: "minimax-m3"
        description: "Minimax M3"
