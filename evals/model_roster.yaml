# Default model roster for the suricata-analyst eval suite (evals/dataset_suricata.py).
# One Case is built per model listed here, in order. Override with `--roster-file <path>`
# (same shape) or `--models a,b,c` on `uv run python -m evals.runner`. See
# refs/pydantic-evals-plan.md.
models:
  - openrouter:qwen/qwen3.7-flash
  - openrouter:deepseek/deepseek-v4-flash
  - openrouter:google/gemini-3.6-flash
  - openrouter:google/gemini-3.5-flash
